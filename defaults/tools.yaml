# The toolchain baseline bundled with fx. A team's manifest/tools.yaml is a
# patch over this file: entries match by name, objects merge, a null deletes
# a field, `enabled: false` retires a tool. Nothing here is team-specific;
# internal registries, hosts and team-only tools belong in the patch.
#
# fx needs none of these to run. An entry without `opt_in` is in every
# workspace's toolchain; an `opt_in` entry joins only the workspaces that name
# it. Either way the commands below are fx's own, so no one confirms them by
# hand — a field a patch overrides becomes the team's and is confirmed again.
schema_version: 2
defaults:
  version_args: [--version]
  install: [{ via: npm }]
  skill: { command: [skill, install], dir_flag: --dir }
  auth: { command: [auth, status] }
tools:
  - name: bitbucket-cli
    desc: Repositories, forks, pull requests and code review on Bitbucket
    min_version: '0.17.0'
    install: [{ via: npm, spec: '@angelmsger/bitbucket-cli' }]
    docs: https://github.com/AngelMsger/bitbucket-cli
  - name: confluence-cli
    min_version: '0.17.0'
    desc: Pages, spaces and comments in Confluence
    install: [{ via: npm, spec: '@angelmsger/confluence-cli' }]
    docs: https://github.com/AngelMsger/confluence-cli
  - name: jenkins-cli
    opt_in: true
    min_version: '0.6.2'
    desc: Jobs, builds and console output in Jenkins
    install: [{ via: npm, spec: '@angelmsger/jenkins-cli' }]
    docs: https://github.com/AngelMsger/jenkins-cli
  - name: openobserve-cli
    opt_in: true
    min_version: '0.11.2'
    desc: Logs, metrics and traces in OpenObserve
    install: [{ via: npm, spec: '@angelmsger/openobserve-cli' }]
    docs: https://github.com/AngelMsger/openobserve-cli
  - name: jira-cli
    min_version: '0.2.1'
    desc: Issues, comments and transitions in Jira
    install: [{ via: npm, spec: '@angelmsger/jira-cli' }]
    docs: https://github.com/AngelMsger/jira-cli
  - name: sentry
    opt_in: true
    min_version: '0.44.1'
    desc: Issues, events and releases in Sentry
    install: [{ via: manual }]
    skill: { command: [] }
    auth: { command: [auth, status] }
    docs: https://cli.sentry.dev/getting-started/installation/
  - name: kubectl
    min_version: '1.37.0'
    desc: Read-only access to Kubernetes clusters
    version_args: [version, --client]
    install:
      - { via: brew, spec: kubectl }
      - { via: manual }
    skill: { command: [] }
    auth: { command: [] }
    docs: https://kubernetes.io/docs/reference/kubectl/
  - name: lark-cli
    opt_in: true
    min_version: '1.0.94'
    desc: Feishu / Lark messaging, documents, calendar and more
    install: [{ via: npm, spec: '@larksuite/cli' }]
    skill: { command: [] }
    auth: { command: [auth, status] }
  - name: meegle
    opt_in: true
    min_version: '1.0.23'
    desc: Feishu Project (Meegle) work items
    install: [{ via: npm, spec: '@lark-project/meegle' }]
    skill: { command: [] }
    auth: { command: [] }
  - name: wecom-cli
    opt_in: true
    min_version: '1.2.1'
    desc: WeCom messaging, documents and calendar
    install: [{ via: npm, spec: '@wecom/cli' }]
    skill: { command: [] }
    auth: { command: [] }
