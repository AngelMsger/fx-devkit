# The catalog of companion CLIs fx knows how to drive: version floor, install
# method and commands, and nothing team-specific. A team's manifest/tools.yaml
# is a patch over it: entries match by name, objects merge, a null deletes a
# field, `enabled: false` retires a tool.
#
# Nothing here is a requirement. A workspace's toolchain is read off its
# provider bindings — binding `ci` to jenkins-cli is what puts jenkins-cli in
# the toolchain — together with whatever its patch names outright. Everything
# else stays in the catalog, unselected. The commands below are fx's own, so
# no one confirms them by hand; a field a patch overrides becomes the team's
# and is confirmed again.
schema_version: 3
defaults:
  version_args: [--version]
  install: [{ via: npm }]
  skill: { command: [skill, install], dir_flag: --dir }
  auth: { command: [auth, status], json: { path: configured, equals: true }, login: [config, init] }
tools:
  - name: bitbucket-cli
    desc: Repositories, forks, pull requests and code review on Bitbucket
    min_version: '0.29.0'
    install: [{ via: npm, spec: '@angelmsger/bitbucket-cli' }]
    docs: https://github.com/AngelMsger/bitbucket-cli
  - name: confluence-cli
    min_version: '0.25.0'
    desc: Pages, spaces and comments in Confluence
    install: [{ via: npm, spec: '@angelmsger/confluence-cli' }]
    docs: https://github.com/AngelMsger/confluence-cli
  - name: jenkins-cli
    min_version: '0.14.0'
    desc: Jobs, builds and console output in Jenkins
    install: [{ via: npm, spec: '@angelmsger/jenkins-cli' }]
    auth:
      command: [auth, status]
      json: { path: authenticated, equals: true }
      login: [config, init]
    docs: https://github.com/AngelMsger/jenkins-cli
  - name: openobserve-cli
    min_version: '0.19.0'
    desc: Logs, metrics and traces in OpenObserve
    install: [{ via: npm, spec: '@angelmsger/openobserve-cli' }]
    auth:
      command: [auth, status]
      json: { path: authenticated, equals: true }
      login: [config, init]
    docs: https://github.com/AngelMsger/openobserve-cli
  - name: prometheus-cli
    min_version: '0.6.0'
    desc: PromQL queries, series discovery, scrape targets and alerts in Prometheus
    install: [{ via: npm, spec: '@angelmsger/prometheus-cli' }]
    auth:
      command: [auth, status]
      json: { path: authenticated, equals: true }
      login: [config, init]
    docs: https://github.com/AngelMsger/prometheus-cli
  - name: jira-cli
    min_version: '0.11.0'
    desc: Issues, comments, transitions and worklogs in Jira
    install: [{ via: npm, spec: '@angelmsger/jira-cli' }]
    docs: https://github.com/AngelMsger/jira-cli
  - name: wecom-calendar-cli
    min_version: '0.7.0'
    desc: A local, searchable mirror of your own WeCom calendars, history included
    install: [{ via: npm, spec: '@angelmsger/wecom-calendar-cli' }]
    docs: https://github.com/AngelMsger/wecom-calendar-cli
  - name: wecom-channel-cli
    min_version: '0.3.0'
    desc: Posts, replies and event updates in WeCom channels
    install: [{ via: npm, spec: '@angelmsger/wecom-channel-cli' }]
    auth:
      command: [doctor]
      json: { path: data.ready, equals: true }
      docs: https://github.com/AngelMsger/wecom-channel-cli/blob/main/docs/security.md
    docs: https://github.com/AngelMsger/wecom-channel-cli
  - name: wecom-chat-cli
    min_version: '0.3.0'
    desc: Scoped WeCom smart-bot tasks and independently reviewed replies
    version_args: [version]
    install: [{ via: npm, spec: '@angelmsger/wecom-chat-cli' }]
    skill: { command: [] }
    auth: { command: [] }
    docs: https://github.com/AngelMsger/wecom-chat-cli
  - name: gh
    min_version: '2.50.0'
    desc: Repositories, branches, pull requests and Actions runs on GitHub
    install:
      - { via: brew, spec: gh }
      - { via: manual }
    skill: { command: [] }
    auth: { command: [auth, status], login: [auth, login] }
    docs: https://cli.github.com/
  - name: sentry
    min_version: '0.49.0'
    desc: Issues, events and releases in Sentry
    install: [{ via: npm, spec: sentry }]
    skill: { command: [] }
    auth: { command: [auth, status] }
    docs: https://cli.sentry.dev/getting-started/installation/
  - name: kubectl
    min_version: '1.37.0'
    desc: Read-only access to Kubernetes clusters
    version_args: [version, --client]
    install:
      - { via: brew, spec: kubectl }
      - { via: manual }
    skill: { command: [] }
    auth: { command: [] }
    docs: https://kubernetes.io/docs/reference/kubectl/
  - name: lark-cli
    min_version: '1.0.99'
    desc: Feishu / Lark messaging, documents, calendar and more
    install: [{ via: npm, spec: '@larksuite/cli' }]
    skill: { command: [] }
    auth: { command: [auth, status] }
  - name: meegle
    min_version: '1.0.28'
    desc: Feishu Project (Meegle) work items
    install: [{ via: npm, spec: '@lark-project/meegle' }]
    skill: { command: [] }
    auth: { command: [] }
  - name: wecom-cli
    min_version: '1.3.4'
    desc: WeCom messaging, documents and calendar
    install: [{ via: npm, spec: '@wecom/cli' }]
    skill: { command: [] }
    auth: { command: [] }
  - name: tmeet
    min_version: '1.1.0'
    desc: Tencent Meeting meetings, recordings, minutes and transcripts
    install: [{ via: npm, spec: '@tencentcloud/tmeet' }]
    skill: { command: [] }
    auth: { command: [] }
    docs: https://github.com/TencentCloud/tencentmeeting-cli
