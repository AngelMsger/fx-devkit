# Public checks always run; npmjs publication stays disabled until explicitly enabled.
name: Public package
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  FX_DISTRIBUTION: public
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - run: node scripts/select-distribution.mjs public
      - run: npm ci
      - run: npm --prefix docs/website ci
      - run: npm install --prefix "$RUNNER_TEMP/fx-tools" bun@1.3.5
      - run: echo "$RUNNER_TEMP/fx-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm run lint && npm run typecheck && npm run docs:check
      - run: npm test && npm run test:bun && npm run test:e2e
      - run: node scripts/check-package.mjs
      - run: npm run site:build && npm run site:check
      - name: Validate public packaging without publishing
        run: node scripts/publish.mjs --dry-run
      - name: Check release version
        if: vars.PUBLIC_RELEASE_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-release.mjs
        env:
          TAG_NAME: ${{ github.ref_name }}
      - name: Publish to npmjs with trusted publishing
        if: vars.PUBLIC_RELEASE_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: node scripts/publish.mjs
