# Public-channel checks for every pull request and push to main. The internal
# channel runs the same checks from Jenkinsfile on the private code host.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  FX_DISTRIBUTION: public
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - run: node scripts/select-distribution.mjs public
      - run: npm ci
      - run: npm --prefix docs/website ci
      - run: npm install --prefix "$RUNNER_TEMP/fx-tools" bun@1.3.5
      - run: echo "$RUNNER_TEMP/fx-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm run lint && npm run typecheck && npm run docs:check
      - run: npm test && npm run test:bun && npm run test:e2e
      - run: node scripts/check-package.mjs
      - run: npm run site:build && npm run site:check
      - name: Validate public packaging without publishing
        run: node scripts/publish.mjs --dry-run

  # Native Windows acceptance (docs/design/windows.md). Manual until the suite
  # passes on windows-latest; Jenkinsfile.windows is the internal equivalent.
  windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      FX_WINDOWS_REPORT: windows-acceptance.json
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - run: node scripts/select-distribution.mjs public
      - run: npm ci
      - run: npm install -g bun@1.3.5
      - run: npm run check:windows
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance
          path: windows-acceptance.json
          if-no-files-found: ignore
