# Checks every change; a v<version> tag also publishes to npmjs once
# repository variable NPM_PUBLISH_ENABLED is 'true' (see docs/delivery.md).
name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/website/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: npm ci
      - run: npm --prefix docs/website ci
      - run: npm run lint && npm run typecheck && npm run docs:check
      - run: npm test && npm run test:bun && npm run test:e2e
      - run: node scripts/check-package.mjs
      - run: npm run site:build && npm run site:check
      - name: Validate packaging without publishing
        run: npm run release -- --dry-run

  # Native Windows support is not verified yet (docs/design/windows.md), so
  # this acceptance run is manual until the suite passes there.
  windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      FX_WINDOWS_REPORT: windows-acceptance.json
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: npm ci
      - run: npm run check:windows
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance
          path: windows-acceptance.json
          if-no-files-found: ignore

  publish:
    if: vars.NPM_PUBLISH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
      - run: npm ci
      - run: node scripts/check-release.mjs
        env:
          TAG_NAME: ${{ github.ref_name }}
      - name: Publish to npmjs with trusted publishing
        run: npm run release
