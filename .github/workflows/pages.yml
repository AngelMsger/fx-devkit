# Validate every website change; deploy main to GitHub Pages.
name: Website
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/website/package-lock.json
      - run: npm ci
      - run: npm run check:examples
      - run: npm --prefix docs/website ci
      - run: npm run docs:check
      - name: Check origin-root hosting
        run: npm run site:build && npm run site:check
      - name: Check repository-subpath hosting
        run: npm run site:build && npm run site:check
        env:
          SITE_BASE_PATH: /fx-devkit/
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        id: pages
        uses: actions/configure-pages@v5
      - name: Build deployment artifact
        if: steps.pages.outcome == 'success'
        run: npm run site:build && npm run site:check
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/website/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
